name = "ltalia-online-scheduler"
main = "index.js"
compatibility_date = "2026-01-01"

[vars]
GITHUB_REPO = "lorenzogirardi/ltalia.online"

# UTC. 05:30 e 10:30 coprono 6:30 e 11:30 Roma in ora solare (CET); 15:30 e 20:30 = 16:30 e 21:30.
# In ora legale (CEST) cadono un'ora dopo lo slot: il gate li recupera comunque (tolleranza 3 ore).
[triggers]
crons = ["30 5 * * *", "30 10 * * *", "30 15 * * *", "30 20 * * *"]
