name: Publish
on:
  schedule:
    # Generazione solo alle 07:00, 14:00, 21:00 UTC. Il job "gate" evita doppioni e recupera
    # un eventuale ritardo di GitHub fino a 2 ore.
    - cron: "0 7,14,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Genera e stampa nei log, senza pubblicare"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# un solo deploy alla volta; non cancella quello in corso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with: { fetch-depth: 0 }
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          export TZ=UTC
          now=$(date +%s)
          slot=""
          # ultimo slot già iniziato oggi (UTC)
          for hm in 07:00 14:00 21:00; do
            s=$(date -d "today $hm" +%s)
            [ "$s" -le "$now" ] && slot=$s
          done
          if [ -z "$slot" ]; then echo "Prima delle 07:00 UTC: niente"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          late=$(( (now - slot) / 60 ))
          last=$(git log -1 --format=%ct --grep='^Nuovi articoli' || true)
          last=${last:-0}
          echo "slot=$slot ritardo=${late}min ultima_generazione=$last"
          if [ "$late" -gt 120 ]; then
            echo "Slot più vecchio di 2 ore: non si recupera"; echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$last" -ge "$slot" ]; then
            echo "Slot già coperto"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: gate
    # solo run schedulate/manuali: un push (grafica, correzioni) non chiama OpenRouter
    if: github.event_name != 'push' && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest -q tests
      - run: python pipeline/run.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      - name: Commit nuovi articoli
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "ltalia-bot"
          git config user.email "ltalia-bot@users.noreply.github.com"
          git add src/content/articles src/data/ticker.json data/processed.json
          git diff --cached --quiet || git commit -m "Nuovi articoli e ultim'ora"
          git pull --rebase -q
          git push

  build:
    needs: [gate, generate]
    # parte anche quando generate è saltato (push), ma non se è fallito né fuori orario
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && (needs.generate.result == 'success' || needs.generate.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - name: Nessun segreto nel sito pubblicato
        run: "! grep -rIl 'OPENROUTER' dist"
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  purge:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verifica la zona Cloudflare
        run: |
          code=$(curl -sS -o zone.json -w "%{http_code}" "https://api.cloudflare.com/client/v4/zones/$CF_ZONE" \
            -H "Authorization: Bearer $CF_TOKEN")
          if [ "$code" != "200" ]; then
            echo "Cloudflare ha risposto HTTP $code: controlla CLOUDFLARE_ZONE_ID (Overview del dominio, non l'Account ID) e i permessi del token"
            python3 -c "import json;print([e.get('message') for e in json.load(open('zone.json')).get('errors',[])])" || true
            exit 1
          fi
          name=$(python3 -c "import json;print(json.load(open('zone.json'))['result']['name'])")
          echo "Zona: $name"
          [ "$name" = "ltalia.online" ] || { echo "Zone ID non corrisponde a ltalia.online"; exit 1; }
      - name: Attende la propagazione di Pages
        run: sleep 20
      - name: Purge cache Cloudflare
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
