name: Publish
on:
  schedule:
    # GitHub ritarda (o salta) i cron: invece di un orario esatto si controlla ogni 30 minuti
    # e il job "gate" decide se c'è uno slot (7:30, 12:30, 17:30, 22:30 ora di Roma) ancora da
    # recuperare. Minuti dispari per evitare i picchi di inizio ora. UTC 5-21 copre ora legale e solare.
    - cron: "17,47 5-21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Genera e stampa nei log, senza pubblicare"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# un solo deploy alla volta; non cancella quello in corso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with: { fetch-depth: 0 }
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          export TZ=Europe/Rome
          now=$(date +%s)
          slot=""
          # ultimo slot già iniziato oggi (ora di Roma)
          for hm in 07:30 12:30 17:30 22:30; do
            s=$(date -d "today $hm" +%s)
            [ "$s" -le "$now" ] && slot=$s
          done
          if [ -z "$slot" ]; then echo "Prima delle 7:30: niente"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          late=$(( (now - slot) / 60 ))
          last=$(git log -1 --format=%ct --grep='^Nuovi articoli' || true)
          last=${last:-0}
          echo "slot=$slot ritardo=${late}min ultima_generazione=$last"
          if [ "$late" -gt 180 ]; then
            echo "Slot più vecchio di 3 ore: non si recupera"; echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$last" -ge "$slot" ]; then
            echo "Slot già coperto"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: gate
    # solo run schedulate/manuali: un push (grafica, correzioni) non chiama OpenRouter
    if: github.event_name != 'push' && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest -q tests
      - run: python pipeline/run.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      - name: Commit nuovi articoli
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "ltalia-bot"
          git config user.email "ltalia-bot@users.noreply.github.com"
          git add src/content/articles data/processed.json
          git diff --cached --quiet || git commit -m "Nuovi articoli"
          git push

  build:
    needs: [gate, generate]
    # parte anche quando generate è saltato (push), ma non se è fallito né fuori orario
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && (needs.generate.result == 'success' || needs.generate.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - name: Nessun segreto nel sito pubblicato
        run: "! grep -rIl 'OPENROUTER' dist"
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
