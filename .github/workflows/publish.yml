name: Publish
on:
  schedule:
    # 7:30, 12:30, 17:30, 22:30 ora di Roma. Il cron è in UTC e non segue l'ora legale:
    # si schedula sia l'offset invernale (+1) sia quello estivo (+2) e il job "gate" lascia
    # passare solo l'esecuzione che cade nell'ora giusta a Roma.
    - cron: "30 5,6,10,11,15,16,20,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Genera e stampa nei log, senza pubblicare"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# un solo deploy alla volta; non cancella quello in corso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          hour=$(TZ=Europe/Rome date +%H)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            case "$hour" in
              07|12|17|22) echo "run=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "run=false" >> "$GITHUB_OUTPUT"; echo "Ora Roma $hour: fuori orario, salto" ;;
            esac
          fi

  generate:
    needs: gate
    # solo run schedulate/manuali: un push (grafica, correzioni) non chiama OpenRouter
    if: github.event_name != 'push' && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest -q tests
      - run: python pipeline/run.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      - name: Commit nuovi articoli
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "ltalia-bot"
          git config user.email "ltalia-bot@users.noreply.github.com"
          git add src/content/articles data/processed.json
          git diff --cached --quiet || git commit -m "Nuovi articoli"
          git push

  build:
    needs: [gate, generate]
    # parte anche quando generate è saltato (push), ma non se è fallito né fuori orario
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && (needs.generate.result == 'success' || needs.generate.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - name: Nessun segreto nel sito pubblicato
        run: "! grep -rIl 'OPENROUTER' dist"
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
